{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sumit Singh | AI Portfolio</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>
    <nav class="site-nav">
        <a class="brand" href="#home" aria-label="Sumit Singh home">
            <span class="brand-mark">SS</span>
            <span>Sumit Singh</span>
        </a>

        <div class="nav-right">
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#skills">Skills</a></li>
                <li><a href="#projects">Projects</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>

            <button class="theme-toggle" type="button" id="theme-toggle" aria-pressed="false">
                <span class="toggle-knob" aria-hidden="true"></span>
                <span id="theme-label">Dark</span>
            </button>
        </div>
    </nav>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        AI Portfolio &copy; 2026
    </footer>

    <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
